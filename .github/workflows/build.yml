name: Build Android APK

on:
  push:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]
  pull_request:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download and Extract Tun2Socks Libs
      run: |
        # Create directories
        mkdir -p app/src/main/jniLibs/arm64-v8a/
        mkdir -p app/src/main/jniLibs/armeabi-v7a/

        # Download SagerNet APKs (Using RC03 as verified)
        wget -O temp_arm64.apk https://github.com/SagerNet/SagerNet/releases/download/0.8.1-rc03/SN-0.8.1-rc03-arm64-v8a.apk
        wget -O temp_armv7.apk https://github.com/SagerNet/SagerNet/releases/download/0.8.1-rc03/SN-0.8.1-rc03-armeabi-v7a.apk

        # Extract libtun2socks.so
        # Note: SagerNet APKs usually contain libtun2socks.so in lib/<arch>/
        unzip -p temp_arm64.apk lib/arm64-v8a/libtun2socks.so > app/src/main/jniLibs/arm64-v8a/libtun2socks.so
        unzip -p temp_armv7.apk lib/armeabi-v7a/libtun2socks.so > app/src/main/jniLibs/armeabi-v7a/libtun2socks.so

        # Cleanup
        rm temp_arm64.apk temp_armv7.apk

        # Verify
        ls -R app/src/main/jniLibs/

    - name: Inspect Strings for JNI Class
      run: |
        echo "=== STRING DUMP ==="
        # Install binutils (if needed)
        sudo apt-get update && sudo apt-get install -y binutils

        # Dump strings and look for the SagerNet package path
        # We expect io/github/sagernet/sagernet/bg/Tun2Socks or similar
        strings app/src/main/jniLibs/arm64-v8a/libtun2socks.so | grep "sagernet" || true
        
        echo "=== END DUMP ==="

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-vpn-debug
        path: app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  push:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]
  pull_request:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download and Extract Tun2Socks Libs
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a/
        mkdir -p app/src/main/jniLibs/armeabi-v7a/

        wget -O temp_vpn.apk https://github.com/heiher/sockstun/releases/download/6.0/hev.sockstun-6.0-release.apk

        # DEBUG: List file contents to find the correct path
        unzip -l temp_vpn.apk

        # Extract allowing for potential path variations (flattening the path)
        unzip -j temp_vpn.apk "lib/arm64-v8a/*tun2socks.so" -d app/src/main/jniLibs/arm64-v8a/
        unzip -j temp_vpn.apk "lib/armeabi-v7a/*tun2socks.so" -d app/src/main/jniLibs/armeabi-v7a/

        # Rename if necessary (in case it's named libhev-socks5-tunnel.so)
        mv app/src/main/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/libtun2socks.so
        mv app/src/main/jniLibs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/libtun2socks.so

        rm temp_vpn.apk
        ls -R app/src/main/jniLibs/

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-vpn-debug
        path: app/build/outputs/apk/debug/app-debug.apk

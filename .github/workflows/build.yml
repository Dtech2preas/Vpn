name: Build Android APK

on:
  push:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]
  pull_request:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download and Extract Tun2Socks Libs (SagerNet)
      run: |
        # Create directories
        mkdir -p app/src/main/jniLibs/arm64-v8a/
        mkdir -p app/src/main/jniLibs/armeabi-v7a/

        # --- ARM64-V8A ---
        echo "Processing ARM64..."
        wget -O temp_vpn_arm64.apk https://github.com/SagerNet/SagerNet/releases/download/0.8.1-rc03/SN-0.8.1-rc03-arm64-v8a.apk

        # Try explicit extraction
        if ! unzip -p temp_vpn_arm64.apk lib/arm64-v8a/libtun2socks.so > app/src/main/jniLibs/arm64-v8a/libtun2socks.so; then
            echo "Direct extraction failed for ARM64. Searching..."
            # Fallback: Extract all .so and find the largest
            mkdir -p temp_libs_arm64
            unzip -j temp_vpn_arm64.apk "lib/arm64-v8a/*.so" -d temp_libs_arm64/
            LARGEST_LIB=$(ls -S temp_libs_arm64/*.so | head -n 1)
            if [ -n "$LARGEST_LIB" ]; then
                cp "$LARGEST_LIB" app/src/main/jniLibs/arm64-v8a/libtun2socks.so
                echo "Renamed $LARGEST_LIB to libtun2socks.so (ARM64)"
            else
                echo "No shared libraries found in ARM64 APK!"
                exit 1
            fi
            rm -rf temp_libs_arm64
        fi

        # --- ARMEABI-V7A ---
        echo "Processing ARMEABI-V7A..."
        wget -O temp_vpn_arm7.apk https://github.com/SagerNet/SagerNet/releases/download/0.8.1-rc03/SN-0.8.1-rc03-armeabi-v7a.apk

        # Try explicit extraction
        if ! unzip -p temp_vpn_arm7.apk lib/armeabi-v7a/libtun2socks.so > app/src/main/jniLibs/armeabi-v7a/libtun2socks.so; then
            echo "Direct extraction failed for ARM7. Searching..."
            # Fallback
            mkdir -p temp_libs_arm7
            unzip -j temp_vpn_arm7.apk "lib/armeabi-v7a/*.so" -d temp_libs_arm7/
            LARGEST_LIB=$(ls -S temp_libs_arm7/*.so | head -n 1)
            if [ -n "$LARGEST_LIB" ]; then
                cp "$LARGEST_LIB" app/src/main/jniLibs/armeabi-v7a/libtun2socks.so
                echo "Renamed $LARGEST_LIB to libtun2socks.so (ARM7)"
            else
                echo "No shared libraries found in ARM7 APK!"
                exit 1
            fi
            rm -rf temp_libs_arm7
        fi

        # Cleanup
        rm temp_vpn_arm64.apk temp_vpn_arm7.apk

        # Verify
        ls -R app/src/main/jniLibs/

    - name: Inspect Strings for JNI Class
      run: |
        echo "=== STRING DUMP ==="
        # Install binutils (if needed)
        sudo apt-get update && sudo apt-get install -y binutils

        # Dump strings and look for the package path
        strings app/src/main/jniLibs/arm64-v8a/libtun2socks.so | grep "sagernet" || true
        
        echo "=== END DUMP ==="

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-vpn-debug
        path: app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  push:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]
  pull_request:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download and Extract Tun2Socks Libs
      run: |
        # Create directories
        mkdir -p app/src/main/jniLibs/arm64-v8a/
        mkdir -p app/src/main/jniLibs/armeabi-v7a/

        # Download APK
        wget -O temp_vpn.apk https://github.com/heiher/sockstun/releases/download/6.0/hev.sockstun-6.0-release.apk

        # Extract using the ACTUAL internal filename (libhev-socks5-tunnel.so)
        # We pipe it (>) to libtun2socks.so so your code finds the right name.
        unzip -p temp_vpn.apk lib/arm64-v8a/libhev-socks5-tunnel.so > app/src/main/jniLibs/arm64-v8a/libtun2socks.so
        unzip -p temp_vpn.apk lib/armeabi-v7a/libhev-socks5-tunnel.so > app/src/main/jniLibs/armeabi-v7a/libtun2socks.so

        # Cleanup
        rm temp_vpn.apk

        # Verify (This should show libtun2socks.so in both folders)
        ls -R app/src/main/jniLibs/

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-vpn-debug
        path: app/build/outputs/apk/debug/app-debug.apk

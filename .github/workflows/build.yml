name: Build Android APK

on:
  push:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]
  pull_request:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download LibXray AAR
      run: |
        mkdir -p app/libs
        wget -O app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v25.12.8/libv2ray.aar

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-vpn-debug
        path: app/build/outputs/apk/debug/app-debug.apk

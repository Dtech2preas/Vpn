name: Build Android APK

on:
  push:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]
  pull_request:
    branches: [ "main", "dtech-vpn-init-10671235161900549711" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download Tun2Socks Native Library (ARM64 & ARM32)
      run: |
        mkdir -p app/src/main/jniLibs/arm64-v8a/
        mkdir -p app/src/main/jniLibs/armeabi-v7a/

        # Download ARM64
        wget -O app/src/main/jniLibs/arm64-v8a/libtun2socks.so \
        https://github.com/heiher/hev-socks5-tunnel/releases/download/2.6.5/hev-socks5-tunnel-arm64-v8a.so

        # Download ARM32
        wget -O app/src/main/jniLibs/armeabi-v7a/libtun2socks.so \
        https://github.com/heiher/hev-socks5-tunnel/releases/download/2.6.5/hev-socks5-tunnel-armeabi-v7a.so

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dtech-vpn-debug
        path: app/build/outputs/apk/debug/app-debug.apk
